<form [formGroup]="requestForm">

  <mat-form-field appearance="outline" class="full">
    <mat-label>Request Title</mat-label>
    <input matInput formControlName="requestTitle">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label>Department</mat-label>
    <input matInput formControlName="department">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label>Sponsorship Type</mat-label>
    <input matInput formControlName="sponsorshipType">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label>Event Name</mat-label>
    <input matInput formControlName="eventName">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label>Event Date</mat-label>
    <input matInput type="date" formControlName="eventDate">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label>Requested Amount</mat-label>
    <input matInput type="number" formControlName="requestedAmount">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label>Purpose</mat-label>
    <textarea matInput formControlName="purpose"></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label>Expected Business Benefit</mat-label>
    <textarea matInput formControlName="expectedBusinessBenefit"></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label>Remarks</mat-label>
    <textarea matInput formControlName="remarks"></textarea>
  </mat-form-field>

  <div class="btn-group">

    <button mat-raised-button color="primary" (click)="submitRequest()" type="button">
      Submit
    </button>

    <button mat-raised-button color="accent" (click)="saveDraft()" type="button">
      Save Draft
    </button>

  </div>

</form>
