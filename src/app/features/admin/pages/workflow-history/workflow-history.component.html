<div class="page-container">

  <h2 class="page-title">
    Workflow History
  </h2>

  <table mat-table [dataSource]="histories">

    <!-- Request Id -->
    <ng-container matColumnDef="requestId">
      <th mat-header-cell *matHeaderCellDef>Request Id</th>
      <td mat-cell *matCellDef="let element">
        {{ element.requestId }}
      </td>
    </ng-container>

    <!-- Action By -->
    <ng-container matColumnDef="actionBy">
      <th mat-header-cell *matHeaderCellDef>Action By</th>
      <td mat-cell *matCellDef="let element">
        {{ element.actionByUserId }}
      </td>
    </ng-container>

    <!-- Old Status -->
    <ng-container matColumnDef="oldStatus">
      <th mat-header-cell *matHeaderCellDef>Old Status</th>
      <td mat-cell *matCellDef="let element">
        {{ element.oldStatus }}
      </td>
    </ng-container>

    <!-- New Status -->
    <ng-container matColumnDef="newStatus">
      <th mat-header-cell *matHeaderCellDef>New Status</th>
      <td mat-cell *matCellDef="let element">
        {{ element.newStatus }}
      </td>
    </ng-container>

    <!-- Remarks -->
    <ng-container matColumnDef="remarks">
      <th mat-header-cell *matHeaderCellDef>Remarks</th>
      <td mat-cell *matCellDef="let element">
        {{ element.remarks }}
      </td>
    </ng-container>

    <!-- Action Date -->
    <ng-container matColumnDef="actionDate">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let element">
        {{ element.actionDate | date:'medium' }}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

</div>
